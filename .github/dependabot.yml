version: 2

# Mises à jour groupées et hebdomadaires. Les mises à jour de sécurité restent
# indépendantes et sont activées dans les paramètres GitHub du dépôt.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      tooling:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - prettier
          - prettier-*
          - typescript
          - typescript-eslint
          - '@types/*'
          - globals
          - '@playwright/test'
          - tailwindcss
          - '@tailwindcss/*'
      production:
        patterns:
          - '@fontsource-variable/*'
    ignore:
      # Astro 5 est imposé par le cahier des charges ; une montée de version
      # majeure doit être une décision explicite, pas une PR automatique.
      - dependency-name: astro
        update-types:
          - version-update:semver-major
      - dependency-name: '@astrojs/*'
        update-types:
          - version-update:semver-major
      # Astro 5 utilise Vite 6 ; Vite 7/8 casse les types et la CI.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      # Astro 5 et @astrojs/check 0.9.x ne supportent que TypeScript 5/6.
      # Une montée vers TypeScript 7 casse la CI (`npm ci`).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(docker)
    groups:
      web-image:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(docker)
    groups:
      api-image:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(docker)
    groups:
      compose-dev:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(docker)
    groups:
      compose-prod:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
