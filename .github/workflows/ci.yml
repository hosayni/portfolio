name: CI

# CI sur chaque pull request et sur les branches de travail. La branche `main`
# est réservée au workflow de déploiement (étape 7), qui dépend de cette CI.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Une nouvelle exécution sur la même référence annule la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège par défaut ; seul CodeQL demande des droits supplémentaires.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  # Surchargeable dans les variables du dépôt si le domaine change.
  SITE_URL: ${{ vars.SITE_URL || 'https://hosayni.com' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        working-directory: web
        run: npm ci

      - name: Vérifier le format
        working-directory: web
        run: npm run format:check

      - name: Linter
        working-directory: web
        run: npm run lint

      - name: Vérifier les types et les composants Astro
        working-directory: web
        run: npm run check

      - name: Construire le site
        working-directory: web
        run: npm run build

      - name: Conserver le build pour les jobs e2e et Lighthouse
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        working-directory: web
        run: npm ci

      - name: Récupérer le build validé par le job web
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Installer Chromium et ses dépendances système
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests Playwright sur le build
        working-directory: web
        run: npm run test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Récupérer le build validé par le job web
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Mesurer performance, accessibilité, bonnes pratiques et SEO
        working-directory: web
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Conserver les rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: web/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r api/requirements-dev.txt

      - name: Linter Ruff
        working-directory: api
        run: ruff check .

      - name: Vérifier le format Ruff
        working-directory: api
        run: ruff format --check .

      - name: Tests et couverture
        working-directory: api
        run: pytest

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Auditer les dépendances npm
        working-directory: web
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node ../.github/scripts/check-npm-audit.mjs \
            "$RUNNER_TEMP/npm-audit.json" \
            ../.github/security/npm-audit-allowlist.json

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Auditer les dépendances Python
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r api/requirements.txt --progress-spinner off --strict

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Analyse sans compilation : suffisante et rapide pour du TypeScript et
      # du Python, et aucune dépendance n'a besoin d'être installée.
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyser le code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # Les PR Dependabot et les forks ont un jeton en lecture seule :
          # l'analyse tourne quand même, mais le SARIF n'est pas publié.
          upload: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
