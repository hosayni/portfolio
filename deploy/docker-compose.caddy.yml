# ---------------------------------------------------------------------------
# Reverse proxy central du VPS.
# À déployer une seule fois, dans /opt/caddy.
# ---------------------------------------------------------------------------
name: caddy-proxy

services:
  caddy:
    image: caddy:2.11.7-alpine
    container_name: caddy
    restart: unless-stopped
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
