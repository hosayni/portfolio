# ---------------------------------------------------------------------------
# Production : images publiées sur ghcr.io par le workflow de déploiement.
# Ce Compose ne contient plus Caddy : le reverse proxy est centralisé dans
# /opt/caddy (voir docs/DEPLOIEMENT.md). web et api rejoignent le réseau
# Docker partagé `proxy`.
# ---------------------------------------------------------------------------
name: portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  portfolio-web:
    image: ghcr.io/${GHCR_OWNER:-hosayni}/portfolio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  portfolio-api:
    image: ghcr.io/${GHCR_OWNER:-hosayni}/portfolio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - portfolio
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  portfolio:
    driver: bridge
  proxy:
    external: true
