# ---------------------------------------------------------------------------
# Développement local : Astro et Flask avec rechargement à chaud.
# Les sources sont montées dans les conteneurs ; aucun Node/Python local n'est
# nécessaire. La configuration réelle est lue depuis `.env` (facultatif).
# ---------------------------------------------------------------------------
name: portfolio-dev

services:
  api:
    build:
      context: ./api
      target: dev
    command: flask --app wsgi run --host 0.0.0.0 --port 8000 --debug
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portfolio-dev

  web:
    build:
      context: ./web
      target: dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      # Vite relaie /api vers le service Flask du réseau Compose.
      API_PROXY_TARGET: http://api:8000
      NODE_ENV: development
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/fr/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portfolio-dev

volumes:
  web_node_modules:

networks:
  portfolio-dev:
    driver: bridge
