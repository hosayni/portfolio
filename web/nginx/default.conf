server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    # Endpoint interne pour le HEALTHCHECK Docker et le reverse proxy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Redirection HTTP réelle vers la langue par défaut (le build Astro
    # contient aussi une page de secours pour les hébergeurs sans nginx).
    location = / {
        return 301 /fr/;
    }

    # 404 personnalisée générée par Astro.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Assets fingerprintés par Astro : cache immuable d'un an.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, polices et autres fichiers publics non fingerprintés : cache
    # raisonnable, invalidé par un changement de nom de fichier.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Ne jamais servir les fichiers cachés (.git, .env…).
    location ~ /\. {
        deny all;
    }

    # Pages statiques. `$uri/` provoque la redirection vers le slash final
    # attendu par Astro (trailingSlash: 'always').
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
